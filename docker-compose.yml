services:
  api:
    build: .
    container_name: rideshare-api
    ports:
      - "8000:8000"
    environment:
      WANDB_MODE: offline
      WANDB_PROJECT: rideshare-surge-pricing
    volumes:
      - ./models:/app/models:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: rideshare-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.1
    container_name: rideshare-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
